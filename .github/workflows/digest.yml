name: Digest quotidien InfoFilter
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Gemini
        run: pip install google-genai
      - name: Generer le digest du jour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python maj_digest.py
      - name: Publier si changement
        run: |
          if [ -n "$(git status --porcelain digests.json)" ]; then
            git config user.name "InfoFilter Bot"
            git config user.email "actions@users.noreply.github.com"
            git add digests.json
            git commit -m "Digest automatique du $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Aucun changement a publier."
          fi
